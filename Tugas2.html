<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Daftar</title>
    <link rel="stylesheet" href="form.css">
    <style>
        select {
            padding: 4px 6px;
            border: 1px solid #999;
            border-radius: 3px;
            font-family: inherit;
            font-size: inherit;
            background-color: #fff;
        }
    </style>
</head>
<body>
    <form>
        <fieldset>
            <legend>Akun</legend>
        <label for="username">Username</label><br>
        <input type="text" id="username" name="username"><br>
        <label for="password">Password</label><br>
        <input type="password" id="password" name="password"><br>
        <label for="konfirmasi_password">Konfirmasi Password</label><br>
        <input type="text" id="konfirmasi_password" name="konfirmasi_password"><br>
        </fieldset>
        <fieldset>
            <legend>Data</legend>
            <label for="nama">  Nama</label><br>
            <input type="text" id="nama" name="nama"><br>

            <label>Jenis Kelamin</label>
            <input type="radio" id="pria" name="jenis_kelamin" value="pria">
            <label for="pria">Pria</label>

            <input type="radio" id="wanita" name="jenis_kelamin" value="wanita">
            <label for="wanita">Wanita</label><br>

            <label>Alamat</label>
            <textarea id="alamat" name="alamat" rows="4" cols="50"></textarea><br>           

            <label>Kota</label>
            <select id="kota" name="kota">
                <option value="jakarta">Jakarta</option>
                <option value="Lampung">Lampung</option>
                <option value="Banda Aceh">Banda Aceh</option>
                <option value="Medan">Medan</option>
            </select><br>

            <label>Informasi Yang Disukai</label> <br>
            <input type="checkbox" id="belajar" name="info" value="belajar">
            <label for="belajar">Belajar</label> <br>

            <input type="checkbox" id="travelling" name="info" value="travelling">
            <label for="travelling">Travelling</label> <br>

            <input type="checkbox" id="tidur" name="info" value="tidur">
            <label for="tidur">Tidur</label> <br>
        </fieldset>

        <input type="submit" value="Daftar">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
